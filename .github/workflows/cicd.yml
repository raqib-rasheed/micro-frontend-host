name: CICD for host

on: 
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v3
      - name: login to docker Hub
        run: docker login -u ${{ secrets.DOCKER_USER }} -p ${{ secrets.DOCKER_PASS }}
      - name: Build docker Image
        run: docker build -t rqbabdl/micro-frontend-host .
      - name: Publish image to docker hub
        run: docker push rqbabdl/micro-frontend-host:latest

  deploy:
    needs: build
    runs-on: micro-frontend-host
    steps:
      - name: Pull image from docker hub
        run: docker pull rqbabdl/micro-frontend-host:latest
      - name: Delete old container
        run: docker rm -f hostContainer
      - name: Run docker container
        run: docker run -d -p 3002:80 --name hostContainer rqbabdl/micro-frontend-host
      
